<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宿主页（PoC）</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; font: 14px/1.6 system-ui, sans-serif; }
      header { padding: 8px 12px; border-bottom: 1px solid #ddd; background: #fafafa; }
      h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
      .行 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #状态 { font-size: 12px; color: #444; }
      label { font-size: 12px; color: #555; }
      select, button { font: inherit; padding: 2px 8px; }
      .chip { font-size: 12px; padding: 1px 8px; border-radius: 10px;
              background: #eee; color: #444; white-space: nowrap; }
      .chip.好 { background: #dcfce7; color: #166534; }
      .chip.糟 { background: #fdeaea; color: #a00; }
      .chip.等 { background: #fef3c7; color: #92400e; }
      main { flex: 1; min-height: 0; display: flex; }
      /* 接入页在另一个源上，所以这里只是一个普通 iframe——
         宿主看不到里面，全部往来都经 postMessage。 */
      #接入页 { flex: 1; border: 0; min-width: 0; }
      #日志 { width: 340px; border-left: 1px solid #ddd; padding: 8px; margin: 0;
              overflow: auto; font-family: ui-monospace, monospace; font-size: 11px;
              white-space: pre-wrap; background: #fcfcfc; }
    </style>
  </head>
  <body>
    <header>
      <h1>宿主页 —— 替将来的控制台/门户</h1>
      <div class="行">
        <button id="保存">保存</button>
        <label>
          凭据怎么给
          <select id="凭据档位">
            <option value="每次现给">每次现给（对的）</option>
            <option value="开场一份">开场给一份用到底（故意写错，看它被拒）</option>
          </select>
        </label>
        <span id="状态">正在加载…</span>
        <!-- 插件那一格的状态。**不能只在右边日志里说**：日志要人主动去读，
             而「插件呢」是第一个会被问的问题——页面上看不见状态时，
             「还没加载完」和「压根没下发」长得一模一样。 -->
        <span id="插件状态" class="chip">插件：等编辑器起来…</span>
      </div>
    </header>
    <main>
      <iframe id="接入页" title="接入页"></iframe>
      <pre id="日志"></pre>
    </main>
    <script type="module" src="/src/host.ts"></script>
  </body>
</html>
